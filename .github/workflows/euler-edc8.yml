name: Euler EDc8 (Lean)
on:
  workflow_dispatch:
  push:
    paths:
      - euler/lean/EulerLean/StageA4o.lean
      - euler/lean/EulerLean/ED/Stage83cut.lean
      - euler/lean/EulerLean/ED/EDc0.lean
      - euler/lean/EulerLean/ED/EDcDefs.lean
      - euler/lean/EulerLean/ED/EDc4.lean
      - euler/lean/EulerLean/ED/EDc7.lean
      - euler/lean/EulerLean/ED/EDc8.lean
      - euler/lean/lean-toolchain
      - euler/lean/lake-manifest.json
      - euler/lean/lakefile.toml
      - euler/lean/agents/build_cached.py
      - euler/lean/agents/check_axioms.py
      - .github/workflows/euler-proof-cache.yml
      - .github/workflows/euler-edc8.yml
permissions:
  contents: read
jobs:
  edc8:
    uses: ./.github/workflows/euler-proof-cache.yml
    with:
      targets: EDc8 EDcSplitTransport.exists_red_conjugator EDcSplitTransport.conj_of_splittings EDcSplitTransport.Lmap_inner EDcSplitTransport.Lmap_Tl EDcSplitTransport.rpeigenAt_transport EDcSplitTransport.rpeigenAt_all EDcSplitTransport.rpeigen_of_one_splitting
