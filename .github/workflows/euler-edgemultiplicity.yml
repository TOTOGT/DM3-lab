name: Euler EdgeMultiplicity v3 (isolated Lean task)
# Isolated task: finite algebra only. Does not touch any other lane; runs only on this branch or by manual dispatch.
on:
  push:
    branches: [edgemult-v3-isolated]
    paths:
      - euler/lean/EulerLean/ED/EdgeMultiplicity.lean
      - .github/workflows/euler-edgemultiplicity.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: euler-edgemultiplicity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/euler-proof-cache.yml
    with:
      targets: |
        EdgeMultiplicity EdgeMultiplicity.card_end_eq_two_mul_card_residual EdgeMultiplicity.two_mul_card_cosetOrbits EdgeMultiplicity.card_cos_eq_twentyfour_mul_orbits EdgeMultiplicity.Tmat_eq_card_orbits
