name: Euler EDc10 (Lean)
on:
  workflow_dispatch:
  push:
    paths:
      - euler/lean/EulerLean/StageA4o.lean
      - euler/lean/EulerLean/ED/EDc10.lean
      - euler/lean/lean-toolchain
      - euler/lean/lake-manifest.json
      - euler/lean/lakefile.toml
      - euler/lean/agents/build_cached.py
      - euler/lean/agents/check_axioms.py
      - .github/workflows/euler-proof-cache.yml
      - .github/workflows/euler-edc10.yml
permissions:
  contents: read
jobs:
  edc10:
    uses: ./.github/workflows/euler-proof-cache.yml
    with:
      targets: EDc10 EulerVertexDraft.linearLevelVertexEquiv EulerVertexDraft.mem_liftedGamma_iff EulerVertexDraft.unit_stabilizer_iff EulerVertexDraft.mem_ker_rho_iff EulerVertexDraft.unitRed_central_iff EulerVertexDraft.card_HurU_eq_card_Gam_mul_card_ker EulerVertexDraft.card_HurU_twelve_two
