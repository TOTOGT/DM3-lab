name: Euler EDc11 (Lean)
on:
  workflow_dispatch:
  push:
    paths:
      - euler/lean/EulerLean/StageA4o.lean
      - euler/lean/EulerLean/ED/EDc11.lean
      - euler/lean/lean-toolchain
      - euler/lean/lake-manifest.json
      - euler/lean/lakefile.toml
      - euler/lean/agents/build_cached.py
      - euler/lean/agents/check_axioms.py
      - .github/workflows/euler-proof-cache.yml
      - .github/workflows/euler-edc11.yml
permissions:
  contents: read
jobs:
  edc11:
    uses: ./.github/workflows/euler-proof-cache.yml
    with:
      targets: EDc11 EdgeCount.card_cos_eq EdgeCount.card_end_symm EdgeCount.Tmat_symm EdgeCount.U_matrix EdgeCount.Tn_matrix
