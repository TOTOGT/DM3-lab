# EDc4b (interface): RPEigen (eigenvalue-level Ramanujan hypothesis) => HPrime204Restricted, via spectral theorem. Does NOT prove RPEigen or HPrime204Restricted.
# Chain: StageA4o Stage83cut EDc0 EDcDefs EDc4b (tracked sources). Does not touch other workflows.
# Gate: Lean 4.32.0 + Mathlib pin, both modules exit 0, no sorry/error, EDc4b axioms within {propext, Classical.choice, Quot.sound}.
name: Euler EDc4b (Lean)

on:
  workflow_dispatch:
  push:
    paths:
      - 'euler/lean/EulerLean/ED/EDc4b.lean'
      - '.github/workflows/euler-edc4b.yml'

jobs:
  edc4b:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: euler/lean
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch Mathlib cache
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get || echo "::warning::cache get failed; Mathlib will build from source"

      - name: Assert pins
        run: |
          set -uxo pipefail
          lake env lean --version | tee /tmp/ver.txt
          grep -q 'version 4.32.0' /tmp/ver.txt || { echo "::error::Lean is not 4.32.0"; exit 1; }
          rev=$(git -C .lake/packages/mathlib rev-parse HEAD)
          [ "$rev" = "81a5d257c8e410db227a6665ed08f64fea08e997" ] || { echo "::error::Mathlib rev mismatch"; exit 1; }

      - name: Compile chain and gate
        run: |
          set -uxo pipefail
          W=$GITHUB_WORKSPACE/ci_edc4b
          mkdir -p $W
          MODS="StageA4o Stage83cut EDc0 EDcDefs EDc4b"
          cp EulerLean/StageA4o.lean $W/
          for m in $MODS; do [ "$m" = StageA4o ] || cp EulerLean/ED/$m.lean $W/; done
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$W"
          for m in $MODS; do
            echo "::group::$m"
            lean -R $W -o $W/$m.olean $W/$m.lean 2>&1 | tee $W/$m.out
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || { echo "::error::$m exited $rc"; exit 1; }
            if grep -nE ": error" $W/$m.out; then echo "::error::error in $m"; exit 1; fi
          done
          # sorry / sorryAx must not appear in the EDc modules' own output
          for m in EDc4b; do
            if grep -nE "(^|[^a-zA-Z_])sorry" $W/$m.out; then echo "::error::sorry in $m"; exit 1; fi
          done
          python3 "$GITHUB_WORKSPACE/euler/lean/agents/check_axioms.py" "$W/EDc4b.out" EDc4b.norm_le_of_eigen_bound EDc4b.norm_le_on_invariant EDc4b.hprime204_of_rpeigen | tee -a "$GITHUB_STEP_SUMMARY"
