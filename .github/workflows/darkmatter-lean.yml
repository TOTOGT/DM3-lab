# Compile the dark-matter Lean file as-is (audit). Trigger: Actions > "DarkMatter Lean audit" > Run workflow.
name: DarkMatter Lean audit
on:
  workflow_dispatch:
jobs:
  dm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: euler/lean
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Fetch Mathlib cache
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get || echo "::warning::cache get failed"
      - name: Compile DarkMatter_MachineVerified.lean (report only)
        run: |
          set -uxo pipefail
          lake env lean DarkMatterCheck/DarkMatter_MachineVerified.lean 2>&1 | tee /tmp/dm.txt || true
          echo "---- errors:"; grep -c "error" /tmp/dm.txt || true
          echo "---- sorry warnings:"; grep -n "sorry" /tmp/dm.txt || true
          echo "---- axioms:"; grep -n -A3 "depends on axioms" /tmp/dm.txt || true
      - name: Compile Wp59Identities.lean (gating)
        run: |
          set -uxo pipefail
          lake env lean DarkMatterCheck/Wp59Identities.lean 2>&1 | tee /tmp/wp59.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/wp59.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/wp59.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n -A3 "depends on axioms\|does not depend" /tmp/wp59.txt
