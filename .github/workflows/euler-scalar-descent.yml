# ScalarDescent: UNTESTED draft. Isolated branch only. Does NOT prove RPEigen.
# Run #1 failed with no output because the step ran under bash -e and died before printing; fixed with set +e.
name: Euler ScalarDescent (Lean, isolated)
on:
  push:
    branches: [scalar-descent-isolated]
    paths:
      - 'euler/lean/EulerLean/ED/ScalarDescent.lean'
      - '.github/workflows/euler-scalar-descent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [cached, direct]
    defaults:
      run:
        working-directory: euler/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned packages
        run: |
          set -euo pipefail
          lake exe cache get
          lake env lean --version
      - name: Build ScalarDescent (full log, no early exit)
        shell: bash {0}
        run: |
          set +e
          if [ "${{ matrix.mode }}" = "cached" ]; then
            python3 agents/build_cached.py --project . --target ScalarDescent > "$RUNNER_TEMP/sd.json" 2> "$RUNNER_TEMP/sd.err"; rc=$?
            echo "build_rc=$rc"; echo "=== sd.json ==="; cat "$RUNNER_TEMP/sd.json"; echo "=== stderr ==="; cat "$RUNNER_TEMP/sd.err"
            log=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("target_log") or d.get("log") or "")' "$RUNNER_TEMP/sd.json" 2>/dev/null)
            if [ -n "$log" ] && [ -f "$log" ]; then echo "=== compiler output ==="; cat "$log"; cp "$log" "$RUNNER_TEMP/out.txt"; fi
          else
            lake build EulerLean.ED.ScalarDescent > "$RUNNER_TEMP/out.txt" 2>&1; rc=$?
            echo "build_rc=$rc"; echo "=== compiler output (tail 400) ==="; tail -n 400 "$RUNNER_TEMP/out.txt"
          fi
          touch "$RUNNER_TEMP/out.txt"
          echo "=== error lines ==="; grep -nE "error" "$RUNNER_TEMP/out.txt" | head -80 || true
          echo "=== sorry lines ==="; grep -n "sorry" "$RUNNER_TEMP/out.txt" | head -40 || true
          echo "=== axioms ==="; grep -nE "depends on axioms|does not depend on any axioms|sorryAx" "$RUNNER_TEMP/out.txt" | head -40 || true
          echo "FINAL build_rc=$rc"
          exit 0
