# Compiles every Lean file under referee/*/ against the pinned-by-update Mathlib in euler/lean.
# Same gate as the Euler workflow: fails on a Lean error, any 'sorry', no axiom report in a file that declares theorems,
# or any axiom outside propext / Classical.choice / Quot.sound. Runs on push touching referee/**/*.lean, or by hand.
name: Referee Lean files

on:
  push:
    paths:
      - 'referee/**/*.lean'
      - '.github/workflows/referee-lean.yml'
  workflow_dispatch:

jobs:
  referee:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch Mathlib cache
        working-directory: euler/lean
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get || echo "::warning::cache get failed; Mathlib will build from source"

      - name: Compile and gate every referee file
        working-directory: euler/lean
        run: |
          set -uxo pipefail
          : > /tmp/summary.md
          status=0
          for f in $(cd "$GITHUB_WORKSPACE" && find referee -name '*.lean' | sort); do
            lake env lean "$GITHUB_WORKSPACE/$f" > /tmp/out.txt 2>&1
            rc=$?
            python3 - "$f" "$rc" <<'PY' || status=1
          import re, sys
          f, rc = sys.argv[1], int(sys.argv[2])
          text = open('/tmp/out.txt', encoding='utf-8', errors='replace').read()
          src = open(f'{__import__("os").environ["GITHUB_WORKSPACE"]}/{f}', encoding='utf-8').read()
          ok = {'propext', 'Classical.choice', 'Quot.sound'}
          reports, bad = [], []
          for line in text.splitlines():
              m = re.search(r"'([^']+)' depends on axioms: \[(.*)\]", line)
              if m:
                  reports.append((m.group(1), m.group(2)))
                  if not {a.strip() for a in m.group(2).split(',')} <= ok: bad.append(line.strip())
              m2 = re.search(r"'([^']+)' does not depend on any axioms", line)
              if m2: reports.append((m2.group(1), 'none'))
          errors = [l for l in text.splitlines() if ': error' in l]
          sorry = [l for l in text.splitlines() if 'sorry' in l]
          needs_reports = '#print axioms' in src
          rows = ['### ' + f, f'exit {rc}; axiom reports {len(reports)}; non-standard {len(bad)}; errors {len(errors)}; sorry {len(sorry)}', '',
                  '| declaration | axioms |', '|---|---|'] + [f'| `{n}` | {a} |' for n, a in reports] + ['']
          open('/tmp/summary.md', 'a').write('\n'.join(rows) + '\n')
          fail = rc != 0 or errors or sorry or bad or (needs_reports and not reports)
          if fail:
              print('::error file=%s::gate failed (exit %d, errors %d, sorry %d, non-standard %d, reports %d)' % (f, rc, len(errors), len(sorry), len(bad), len(reports)))
              sys.exit(1)
          PY
          done
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
