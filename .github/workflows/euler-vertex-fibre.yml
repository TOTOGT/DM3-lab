name: Euler vertex, edge and fibre transport (Lean)
on:
  pull_request:
    paths: &inputs
      - euler/lean/EulerLean/StageA4o.lean
      - euler/lean/EulerLean/ED/EDc6.lean
      - euler/lean/EulerLean/ED/EDc10.lean
      - euler/lean/EulerLean/ED/FibrePushforward.lean
      - euler/lean/EulerLean/ED/VertexDoubleOrbit.lean
      - euler/lean/EulerLean/ED/EDc11.lean
      - euler/lean/EulerLean/ED/UnitEndpointOrbits.lean
      - .github/workflows/euler-proof-cache.yml
      - euler/lean/lean-toolchain
      - euler/lean/lakefile.toml
      - euler/lean/lake-manifest.json
      - euler/lean/agents/build_cached.py
      - euler/lean/agents/check_axioms.py
      - .github/workflows/euler-vertex-fibre.yml
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: euler-vertex-fibre-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/euler-proof-cache.yml
    with:
      targets: |
        VertexDoubleOrbit EulerVertexOrbit.doubleOrbitRel_iff EulerVertexOrbit.doubleOrbitEquiv EulerVertexOrbit.doubleOrbitEquiv_mk EulerVertexOrbit.stabilizer_eq_kernel EulerVertexOrbit.stabilizer_card
        FibrePushforward EulerWeilFibre.fibre_sum_reindex EulerWeilFibre.fibrePush_relabel EulerWeilFibre.ker_fibrePush_relabel EulerWeilFibre.orth_iff_mem_ker_fibrePush EulerWeilFibre.orth_iff_mem_ker_fibrePush_swap EulerWeilFibre.mem_ker_fibrePush
        UnitEndpointOrbits EdgeUnitOrbits.residual_iff EdgeUnitOrbits.orbitMap_injective EdgeUnitOrbits.orbitMap_surjective EdgeUnitOrbits.orbitEquiv
