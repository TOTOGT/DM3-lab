# EDcDefs (A-shaped definitions + H31gt3A_of_H31gt3): StageA4o -> Stage83cut -> EDc0 -> EDcDefs against TRACKED sources.
# EDcert is NOT built.  Does not touch euler-ed.yml or euler-edc.yml.  Runs unattended on GitHub; manual dispatch or push to EDcDefs.
# Gate: Lean 4.32.0 + Mathlib pin, every module exits 0, no sorry/error, EDcDefs axioms within {propext, Classical.choice, Quot.sound}.
name: Euler EDcDefs (Lean)

on:
  workflow_dispatch:
  push:
    paths:
      - 'euler/lean/EulerLean/ED/EDcDefs.lean'
      - '.github/workflows/euler-edcdefs.yml'

jobs:
  edcdefs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: euler/lean
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch Mathlib cache
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get || echo "::warning::cache get failed; Mathlib will build from source"

      - name: Assert pins
        run: |
          set -uxo pipefail
          lake env lean --version | tee /tmp/ver.txt
          grep -q 'version 4.32.0' /tmp/ver.txt || { echo "::error::Lean is not 4.32.0"; exit 1; }
          rev=$(git -C .lake/packages/mathlib rev-parse HEAD)
          [ "$rev" = "81a5d257c8e410db227a6665ed08f64fea08e997" ] || { echo "::error::Mathlib rev mismatch"; exit 1; }

      - name: Compile chain and gate
        run: |
          set -uxo pipefail
          W=$GITHUB_WORKSPACE/ci_edcdefs
          mkdir -p $W
          cp EulerLean/StageA4o.lean EulerLean/ED/Stage83cut.lean EulerLean/ED/EDc0.lean EulerLean/ED/EDcDefs.lean $W/
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$W"
          for m in StageA4o Stage83cut EDc0 EDcDefs; do
            echo "::group::$m"
            lean -R $W -o $W/$m.olean $W/$m.lean 2>&1 | tee $W/$m.out
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || { echo "::error::$m exited $rc"; exit 1; }
            if grep -nE ": error" $W/$m.out; then echo "::error::error in $m"; exit 1; fi
          done
          # sorry / sorryAx must not appear in the EDc modules' own output
          for m in EDc0 EDcDefs; do
            if grep -nE "(^|[^a-zA-Z_])sorry" $W/$m.out; then echo "::error::sorry in $m"; exit 1; fi
          done
          line=$(grep -A2 "EDcDefs.H31gt3A_of_H31gt3' depends on axioms" $W/EDcDefs.out | tr '\n' ' ')
          echo "$line"
          [ -n "$line" ] || { echo "::error::axiom report missing"; exit 1; }
          rest=$(echo "$line" | sed -E "s/.*depends on axioms: \[//; s/\].*//; s/propext//; s/Classical.choice//; s/Quot.sound//; s/[, ]//g")
          [ -z "$rest" ] || { echo "::error::unexpected axioms: $rest"; exit 1; }
          echo "### EDcDefs\n$line" >> $GITHUB_STEP_SUMMARY
