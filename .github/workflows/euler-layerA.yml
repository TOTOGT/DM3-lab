# Layer A (finite algebra for H31gt3). Standalone files, each imports only Mathlib.
# Trigger: Actions > "Euler layer A (Lean)" > Run workflow.
name: Euler layer A (Lean)

on:
  workflow_dispatch:

jobs:
  layerA:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: euler/lean
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch Mathlib cache
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get || echo "::warning::cache get failed; Mathlib will build from source"

      - name: Bridge (A0)
        run: |
          set -uxo pipefail
          lake env lean EulerLean/Bridge.lean 2>&1 | tee /tmp/bridge.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/bridge.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/bridge.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n -A4 "depends on axioms" /tmp/bridge.txt

      - name: StageA1
        run: |
          set -uxo pipefail
          lake env lean EulerLean/StageA1.lean 2>&1 | tee /tmp/a1.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/a1.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/a1.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n -A4 "depends on axioms" /tmp/a1.txt
          { echo "### StageA1"; echo "warnings: $(grep -c 'warning:' /tmp/a1.txt)"; echo '```'; grep -A4 "depends on axioms" /tmp/a1.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: StageA2
        run: |
          set -uxo pipefail
          lake env lean EulerLean/StageA2.lean 2>&1 | tee /tmp/a2.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/a2.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/a2.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n -A4 "depends on axioms" /tmp/a2.txt
          { echo "### StageA2"; echo "warnings: $(grep -c 'warning:' /tmp/a2.txt)"; echo '```'; grep -A4 "depends on axioms" /tmp/a2.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: StageA3a
        run: |
          set -uxo pipefail
          lake env lean EulerLean/StageA3a.lean 2>&1 | tee /tmp/a3a.txt
          rc=${PIPESTATUS[0]}
          { echo "### StageA3a (lean exit code $rc)"; echo "warnings: $(grep -c 'warning:' /tmp/a3a.txt)"; echo '```'; (grep "depends on axioms" /tmp/a3a.txt | grep SectionA3a || true); echo '```'; echo "errors:"; echo '```'; (grep -A8 "error" /tmp/a3a.txt || true) | head -120; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/a3a.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/a3a.txt && { echo "::error::error in output"; exit 1; } || true
