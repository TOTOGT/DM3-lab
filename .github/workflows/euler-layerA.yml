# Layer A (finite algebra for H31gt3). Standalone files, each imports only Mathlib.
# Trigger: Actions > "Euler layer A (Lean)" > Run workflow.
name: Euler layer A (Lean)

on:
  workflow_dispatch:

jobs:
  layerA:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: euler/lean
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch Mathlib cache
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get || echo "::warning::cache get failed; Mathlib will build from source"

      - name: Bridge (A0)
        run: |
          set -uxo pipefail
          lake env lean EulerLean/Bridge.lean 2>&1 | tee /tmp/bridge.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/bridge.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/bridge.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n -A4 "depends on axioms" /tmp/bridge.txt

      - name: StageA1
        run: |
          set -uxo pipefail
          lake env lean EulerLean/StageA1.lean 2>&1 | tee /tmp/a1.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/a1.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/a1.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n -A4 "depends on axioms" /tmp/a1.txt
