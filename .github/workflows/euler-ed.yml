# Compiles the ED layer (HPrime implies H31gt3 and Euler for n = 2 mod 4) in dependency order and gates it.
# Sources: euler/lean/EulerLean/StageA4o.lean, euler/lean/EulerLean/ED/*.lean (Stage83cut.lean included).
# Fails on: a Lean error, any 'sorry' in the chain, a missing axiom report for euler_1747_of_hprime,
# or an axiom outside propext / Classical.choice / Quot.sound / the one native_decide axiom.
# Run on demand: Actions > this workflow > Run workflow.
name: Euler ED layer (lake build)

on:
  push:
    paths:
      - 'euler/lean/EulerLean/StageA4o.lean'
      - 'euler/lean/EulerLean/ED/EDa*.lean'
      - 'euler/lean/EulerLean/ED/EDb*.lean'
      - 'euler/lean/EulerLean/ED/Stage83cut.lean'
      - 'euler/lean/lean-toolchain'
      - 'euler/lean/lakefile.toml'
      - 'euler/lean/lake-manifest.json'
      - 'euler/lean/agents/check_axioms.py'
      - '.github/workflows/euler-ed.yml'
  workflow_dispatch:

jobs:
  ed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: euler/lean
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch Mathlib cache
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get || echo "::warning::cache get failed; Mathlib will build from source"

      - name: Compile the chain in order
        run: |
          set -uxo pipefail
          W=$GITHUB_WORKSPACE/ci_ed
          mkdir -p $W
          cp EulerLean/StageA4o.lean $W/
          cp EulerLean/ED/*.lean $W/
          rm -f $W/EDa2.lean $W/EDb6test.lean   # scratch files, not in the chain
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$W"
          for m in StageA4o EDa1 EDa3 EDa4 EDa5 EDa6 EDa7 EDa8 EDa9 EDb1 EDb2 EDb3 EDb4 EDb5 EDb6 Stage83cut EDb7 EDb8 EDb9; do
            echo "::group::$m"
            lean -R $W -o $W/$m.olean $W/$m.lean 2>&1 | tee $W/$m.out
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then echo "::error::$m failed (exit $rc)"; exit 1; fi
          done

      - name: Gate and axiom report
        run: |
          set -uxo pipefail
          W=$GITHUB_WORKSPACE/ci_ed
          cat > $W/Axioms.lean <<'LEAN'
          import EDb9
          #print axioms EDb9.euler_1747_of_hprime
          #print axioms EDb8.H31gt3_of_hprime
          LEAN
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$W"
          lean -R $W $W/Axioms.lean 2>&1 | tee $W/axioms.txt || exit 1
          if grep -l "sorry" $W/ED*.out $W/Stage83cut.out 2>/dev/null; then echo "::error::sorry in chain"; exit 1; fi
          python3 agents/check_axioms.py "$W/axioms.txt" EDb8.H31gt3_of_hprime | tee -a "$GITHUB_STEP_SUMMARY" || exit 1
          python3 agents/check_axioms.py "$W/axioms.txt" EDb9.euler_1747_of_hprime --allow propext --allow Classical.choice --allow Quot.sound --allow Euler1747.allOk_true._native.native_decide.ax_1_1 | tee -a "$GITHUB_STEP_SUMMARY"
