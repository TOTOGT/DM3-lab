# Manual run for the elementary-lemma files (fast, no native_decide step).
# Trigger: Actions > "Euler elementary lemmas (Lean)" > Run workflow.
# Files: Section6Arithmetic.lean (Lemma 5.1 / Prop 6.1 arithmetic), Lemma41.lean (Lemma 4.1, integer and real cutoff), Lemma52.lean (estimate (5.2)), LocalFactors.lean (Lemma 5.1 maximization), Sufficiency23.lean ((2.3) sufficiency), Lemma42.lean (Lemma 4.2, conditional on the two-square count), Lemma51.lean (Lemma 5.1 first bound, multiplicative assembly).
# Both were written without a local Lean toolchain and had never been compiled when this was added.
name: Euler elementary lemmas (Lean)

on:
  workflow_dispatch:

jobs:
  elementary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: euler/lean
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch Mathlib cache
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get || echo "::warning::cache get failed; Mathlib will build from source"

      - name: Section6Arithmetic
        run: |
          set -uxo pipefail
          lake env lean EulerLean/Section6Arithmetic.lean 2>&1 | tee /tmp/s6.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/s6.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/s6.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n "depends on axioms\|does not depend" /tmp/s6.txt

      - name: Lemma41
        if: always()
        run: |
          set -uxo pipefail
          lake env lean EulerLean/Lemma41.lean 2>&1 | tee /tmp/l41.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/l41.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/l41.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n "depends on axioms" /tmp/l41.txt

      - name: Lemma52
        if: always()
        run: |
          set -uxo pipefail
          lake env lean EulerLean/Lemma52.lean 2>&1 | tee /tmp/l52.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/l52.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/l52.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n "depends on axioms" /tmp/l52.txt

      - name: LocalFactors
        if: always()
        run: |
          set -uxo pipefail
          lake env lean EulerLean/LocalFactors.lean 2>&1 | tee /tmp/lf.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/lf.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/lf.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n "depends on axioms" /tmp/lf.txt

      - name: Sufficiency23
        if: always()
        run: |
          set -uxo pipefail
          lake env lean EulerLean/Sufficiency23.lean 2>&1 | tee /tmp/s23.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/s23.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/s23.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n "depends on axioms" /tmp/s23.txt

      - name: Lemma42 (conditional)
        if: always()
        run: |
          set -uxo pipefail
          lake env lean EulerLean/Lemma42.lean 2>&1 | tee /tmp/l42.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/l42.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/l42.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n "depends on axioms" /tmp/l42.txt

      - name: Lemma51 (first bound)
        if: always()
        run: |
          set -uxo pipefail
          lake env lean EulerLean/Lemma51.lean 2>&1 | tee /tmp/l51.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/l51.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/l51.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n "depends on axioms" /tmp/l51.txt

      - name: Bridge (finite algebra, hquad as hypothesis)
        if: always()
        run: |
          set -uxo pipefail
          lake env lean EulerLean/Bridge.lean 2>&1 | tee /tmp/bridge.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/bridge.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/bridge.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n "depends on axioms" /tmp/bridge.txt

      - name: Stage61a (small-prime sum, Prop 3.1 as hypothesis)
        if: always()
        run: |
          set -uxo pipefail
          lake env lean EulerLean/Stage61a.lean 2>&1 | tee /tmp/s61a.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::lean exited $rc"; exit 1; }
          grep -n "sorry" /tmp/s61a.txt && { echo "::error::sorry"; exit 1; } || true
          grep -n "error" /tmp/s61a.txt && { echo "::error::error in output"; exit 1; } || true
          grep -n "depends on axioms" /tmp/s61a.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Elementary lemmas: compiler output"
            echo '```'
            cat /tmp/s6.txt /tmp/l41.txt /tmp/l52.txt /tmp/lf.txt /tmp/s23.txt /tmp/l42.txt /tmp/l51.txt /tmp/bridge.txt /tmp/s61a.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
